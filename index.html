<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div>
        <h1>Attendance Management Portal</h1>
        <p>Add, review, correct and remove attendance records.</p>
      </div>
      <button type="button" id="logout-btn" class="btn" hidden>Log out</button>
    </div>
  </header>

  <main class="wrap">
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <section id="login" class="card" aria-labelledby="login-title" hidden>
      <h2 id="login-title">Admin login</h2>
      <form id="login-form">
        <label>Password
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button type="submit" id="login-btn" class="btn primary">Log in</button>
        </div>
      </form>
    </section>

    <div id="app" hidden>
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Add attendance record</h2>
        <form id="record-form" novalidate>
          <div class="grid">
            <label>Date
              <input type="date" id="date" name="date" required>
            </label>
            <label>Student name
              <input type="text" id="studentName" name="studentName" maxlength="100" required autocomplete="off">
            </label>
            <label>Subject name
              <input type="text" id="subjectName" name="subjectName" maxlength="100" required autocomplete="off">
            </label>
            <label>Section
              <input type="text" id="section" name="section" maxlength="100" required autocomplete="off">
            </label>
            <label>Status
              <select id="status" name="status">
                <option>Present</option>
                <option>Absent</option>
                <option>Late</option>
                <option>Excused</option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button type="submit" id="submit-btn" class="btn primary">Add record</button>
            <button type="button" id="cancel-btn" class="btn" hidden>Cancel edit</button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title">Records <span id="count" class="muted"></span></h2>
          <input type="search" id="filter" placeholder="Filter by name, subject or section" aria-label="Filter records">
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Student</th>
                <th>Subject</th>
                <th>Section</th>
                <th>Status</th>
                <th><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p id="empty" class="muted empty" hidden></p>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
